name: AKIRA Windows - verificar y compilar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Obtener codigo privado
        uses: actions/checkout@v4

      - name: Preparar Python de 64 bits
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Pruebas de regresion principales
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v1632_integrated_research_voice.py tests/test_v1632_resource_and_wheel.py tests/test_v1632_storage_cleanup.py tests/test_v1631_capital_adaptive.py tests/test_install_checks.py

      - name: Compilar y autocontrolar AKIRA.exe en Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          python build_windows.py --source . --diagnostic diagnostics

      - name: Empaquetar ejecutable SOLO si todas las pruebas pasan
        shell: pwsh
        run: |
          $exe = 'native/AKIRA/AKIRA.exe'
          if (!(Test-Path $exe)) { throw 'No se produjo AKIRA.exe' }
          if ((Get-Item $exe).Length -lt 100000) { throw 'AKIRA.exe parece incompleto' }
          Compress-Archive -Path native/AKIRA/* -DestinationPath AKIRA_windows_build.zip -Force

      - name: Descargar binario construido
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-build-no-es-instalador
          path: AKIRA_windows_build.zip
          retention-days: 7

      - name: Descargar diagnosticos incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-diagnosticos
          path: |
            diagnostics/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
