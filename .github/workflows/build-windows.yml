name: AKIRA Windows - verificar y compilar
run-name: AKIRA 16.3.5 R8 · IA incluida · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - akira-r8-studio-rev4-20261016

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Obtener código de AKIRA
        uses: actions/checkout@v4

      - name: Preparar Python de 64 bits
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verificar que se incorporo REV4 antes de construir el instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('akira_studio.py', 'akira_studio_ui.py', 'operation_health.py',
                        'activity_watchdog.py', 'studio_theme.py', 'REQUISITOS_232_ESTADO.csv',
                        'installer/smoke_local_ai.py', 'installer/akira.iss')
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file)) {
              throw "Código REV4 incompleto: falta $file. No publicar un instalador antiguo."
            }
          }
          $build = python -c "from akira_version import BUILD_ID; print(BUILD_ID)"
          if ($LASTEXITCODE -ne 0 -or $build.Trim() -ne 'AKIRA_16_3_5_R8') {
            throw "Identidad de compilación inesperada: $build"
          }
          Write-Host 'Fuente R8 Studio encontrada. Esta prueba no certifica MT5 demo ni rentabilidad.'

      - name: Pruebas de regresion principales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          python -m pytest -q tests -ra --junitxml=diagnostics/REGRESSION_TESTS.xml

      - name: Compilar y autocontrolar AKIRA.exe en Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          python build_windows.py --source . --diagnostic diagnostics

      - name: Incorporar llama.cpp oficial para Windows (CPU y Vulkan)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'https://github.com/ggml-org/llama.cpp/releases/download/b10355/'
          $items = @(
            @{ Name = 'llama-b10355-bin-win-vulkan-x64.zip'; Hash = '8ce9d58912f60974e2bd796e8a28826abb0801121454d451373ab98d8dd00f77'; Dest = 'bin' },
            @{ Name = 'llama-b10355-bin-win-cpu-x64.zip'; Hash = '5488e6232c6114d81302adc616d6c7470a8c06e24140e1baf1d0a85e3b731adc'; Dest = 'cpu' }
          )
          foreach ($item in $items) {
            $archive = Join-Path $env:RUNNER_TEMP $item.Name
            curl.exe -fL --retry 4 --retry-all-errors -o $archive ($release + $item.Name)
            if ($LASTEXITCODE -ne 0) { throw 'Error descargando el motor local oficial' }
            $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $item.Hash) { throw 'SHA256 incorrecto para ' + $item.Name }
            $extract = Join-Path $env:RUNNER_TEMP ('akira_llama_' + $item.Dest)
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $binary = Get-ChildItem $extract -Recurse -Filter 'llama-server.exe' | Select-Object -First 1
            if ($null -eq $binary) { throw 'Falta llama-server.exe en ' + $item.Name }
            $target = Join-Path 'native/AKIRA/local_ai' $item.Dest
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path (Join-Path $binary.DirectoryName '*') -Destination $target -Recurse -Force
          }
          if (!(Test-Path 'native/AKIRA/local_ai/bin/llama-server.exe')) { throw 'Vulkan no empaquetado' }
          if (!(Test-Path 'native/AKIRA/local_ai/cpu/llama-server.exe')) { throw 'CPU no empaquetado' }

      - name: Incorporar componente JavaScript de YouTube verificado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'deno-windows.zip'
          curl.exe -fL --retry 4 --retry-all-errors -o $archive 'https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar Deno oficial' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238') { throw 'Deno: SHA-256 incorrecto' }
          New-Item -ItemType Directory -Force -Path native/AKIRA/bin | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath native/AKIRA/bin -Force
          New-Item -ItemType Directory -Force -Path native/AKIRA/licenses | Out-Null
          Copy-Item third_party/DENO_LICENSE.txt native/AKIRA/licenses/DENO_LICENSE.txt
          if (!(Test-Path 'native/AKIRA/bin/deno.exe')) { throw 'Falta Deno en el paquete' }

      - name: Comprobar IA real en Windows sin Ollama
        shell: pwsh
        run: |
          python installer/smoke_local_ai.py --exe native/AKIRA/local_ai/cpu/llama-server.exe --model "$env:RUNNER_TEMP\Qwen3-4B-Q4_K_M.gguf" --report diagnostics/LOCAL_AI_SCENARIOS.json

      - name: Empaquetar ejecutable con motor local (sin el modelo GGUF)
        shell: pwsh
        run: |
          $exe = 'native/AKIRA/AKIRA.exe'
          if (!(Test-Path $exe)) { throw 'No se produjo AKIRA.exe' }
          if ((Get-Item $exe).Length -lt 100000) { throw 'AKIRA.exe parece incompleto' }
          Compress-Archive -Path native/AKIRA/* -DestinationPath AKIRA_windows_build.zip -Force

      - name: Compilar instalador Windows con logo, Instalar y Cancelar
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo instalar el compilador Inno Setup' }
          $env:AKIRA_MODEL_PATH = Join-Path $env:RUNNER_TEMP 'Qwen3-4B-Q4_K_M.gguf'
          if (!(Test-Path $env:AKIRA_MODEL_PATH)) { throw 'Falta el modelo que pasó la prueba de IA' }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { & $iscc.Source 'installer/akira.iss' }
          else { & (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe') 'installer/akira.iss' }
          if ($LASTEXITCODE -ne 0) { throw 'No se compiló el instalador de AKIRA' }
          $setup = Get-ChildItem 'dist_installer' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $setup -or $setup.Length -lt 2000000000) { throw 'El instalador no incluye el modelo completo' }

      - name: Probar instalador completo y respuesta de la IA instalada
        shell: pwsh
        timeout-minutes: 20
        run: |
          $setup = Get-ChildItem 'dist_installer' -Filter '*_IA_INCLUIDA.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'No se encontró el instalador con la IA incluida' }
          $target = Join-Path $env:RUNNER_TEMP 'AKIRA_INSTALACION_VERIFICADA'
          python -m installer.check_installed_ai --setup "$($setup.FullName)" --root "$target" --report diagnostics/INSTALLED_LOCAL_AI.json
          if ($LASTEXITCODE -ne 0) { throw 'La instalación real o la IA instalada no pasaron la prueba; no se publica' }

      - name: Publicar instalador de AKIRA con IA incluida y verificada
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-16.3.5-R8-IA-fuentes-expresiones-instalador-Windows-IA-INCLUIDA
          compression-level: 0
          path: dist_installer/*.exe
          retention-days: 7

      - name: Descargar binario construido
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-build-no-es-instalador
          path: AKIRA_windows_build.zip
          retention-days: 7

      - name: Descargar diagnosticos incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-diagnosticos
          path: |
            diagnostics/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
