name: AKIRA Windows - verificar y compilar
run-name: AKIRA 16.4.6 Studio Rev11 · protección runners · chat · equipos modestos · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - akira-studio-rev11-20261020

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Obtener código de AKIRA
        uses: actions/checkout@v4

      - name: Preparar Python de 64 bits
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Comprobar importaciones del cliente y del instalador antes de compilar
        shell: pwsh
        run: |
          python -m installer.smoke_local_ai --check-imports
          if ($LASTEXITCODE -ne 0) { throw 'El comprobador no puede importar el cliente de IA de AKIRA.' }
          python -m installer.check_installed_ai --check-imports
          if ($LASTEXITCODE -ne 0) { throw 'El comprobador de instalación no puede importar sus validadores.' }

      - name: Comprobar y aislar Tcl-Tk de Python antes de las regresiones
        shell: pwsh
        run: |
          python -m installer.check_tk_runtime --dest "$env:RUNNER_TEMP/AKIRA_TCL_TK_VERIFICADO" --report diagnostics/TK_RUNTIME.json --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'La biblioteca gráfica de Python está incompleta o no carga. Revisa TK_RUNTIME.json.' }

      - name: Verificar que se incorporo REV11 antes de construir el instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('akira_studio.py', 'akira_studio_ui.py', 'operation_health.py',
                        'activity_watchdog.py', 'studio_theme.py', 'REQUISITOS_232_ESTADO.csv',
                        'installer/smoke_local_ai.py', 'installer/akira.iss', 'studio_presenter.py',
                        'studio_editors.py', 'local_ai_repair.py', 'qa_real_conversation_rev6.py',
                        'assets/avatar_states/akira_rev6_motion.png','assets/avatar_states/motion_bounds.json','entry_momentum.py','network_tls.py','public_derivatives.py','compact_review.py','qa_sources_rev10.py','qa_review_rev10.py','qa_low_resource_rev7.py','installer/check_https.py','runner_protection.py','conversation_intent.py','order_timing.py','qa_conversation_rev11.py','tests/test_studio_rev11_capital_chat_timing.py')
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file)) {
              throw "Código REV11 incompleto: falta $file. No publicar un instalador antiguo."
            }
          }
          $build = python -c "from akira_version import BUILD_ID; print(BUILD_ID)"
          if ($LASTEXITCODE -ne 0 -or $build.Trim() -ne 'AKIRA_16_4_6_STUDIO_REV11') {
            throw "Identidad de compilación inesperada: $build"
          }
          Write-Host 'Fuente Studio Rev11 encontrada. Esta prueba no certifica MT5 demo ni rentabilidad.'

      - name: Leer biblioteca y derivados públicos reales antes de compilar
        shell: pwsh
        run: |
          python qa_sources_rev10.py --report diagnostics/PUBLIC_SOURCES_SOURCE_REV10.json
          if ($LASTEXITCODE -ne 0) { throw 'No se verificaron las lecturas públicas reales; revisar cobertura y diagnóstico antes de compilar.' }

      - name: Pruebas de regresion principales
        timeout-minutes: 15
        shell: pwsh
        env:
          AKIRA_TEST_DIAGNOSTICS: diagnostics
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          python -u -m pytest -vv tests -ra -o faulthandler_timeout=30 --junitxml=diagnostics/REGRESSION_TESTS.xml
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las regresiones. Revisa la prueba indicada y REGRESSION_TESTS.xml en los diagnósticos.' }
          python -c "from xml.etree import ElementTree as E; r=E.parse('diagnostics/REGRESSION_TESTS.xml').getroot(); n=len(r.findall('.//testcase/skipped')); print('Pruebas omitidas:',n); assert n==0, 'La regresión debe comprobar también todos los paneles gráficos'"
          if ($LASTEXITCODE -ne 0) { throw 'La regresión omitió comprobaciones; no se publica una validación parcial.' }

      - name: Incorporar reconocimiento visual local de sprites
        shell: pwsh
        run: |
          python -m installer.prepare_sprite_ai --dest assets/sprite_vision
          if ($LASTEXITCODE -ne 0) { throw 'No se descargó el componente visual íntegro; no publicar un instalador incompleto' }
          python -c "import json; from sprite_recognition import check_visual_component; from pathlib import Path; Path('diagnostics/SPRITE_AI_SOURCE.json').write_text(json.dumps(check_visual_component(), indent=2), encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'La inferencia visual local de origen no pasó' }
          python -m installer.prepare_licenses --dest third_party/packages
          if ($LASTEXITCODE -ne 0) { throw 'No se prepararon las licencias de los componentes.' }

      - name: Compilar y autocontrolar AKIRA.exe Studio en Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          python -u -c "import subprocess,sys; sys.exit(subprocess.run([sys.executable,'-u','Akira.py','--self-check','diagnostics/SOURCE_SELF_CHECK.json','--app-root','.'],timeout=90).returncode)"
          if ($LASTEXITCODE -ne 0) { throw 'El autocontrol gráfico de origen falló. Revisa SOURCE_SELF_CHECK.json antes de compilar.' }
          python build_windows.py --source . --diagnostic diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'No pasó el ejecutable nuevo; no publicar' }
          $visual = Start-Process -FilePath './native/AKIRA/AKIRA.exe' -ArgumentList @('--sprite-ai-check', 'diagnostics/SPRITE_AI_FROZEN.json') -Wait -PassThru
          if ($visual.ExitCode -ne 0 -or !(Test-Path 'diagnostics/SPRITE_AI_FROZEN.json')) { throw 'El reconocimiento visual no funciona dentro del ejecutable' }
          if ((Get-Content -Raw 'diagnostics/SPRITE_AI_FROZEN.json' | ConvertFrom-Json).status -ne 'PASSED') { throw 'La prueba visual no produjo un resultado válido' }

      - name: Comprobar certificados HTTPS y rendimiento con dos núcleos en el ejecutable
        shell: pwsh
        run: |
          python installer/check_https.py --report diagnostics/HTTPS_SOURCE_REV10.json
          if ($LASTEXITCODE -ne 0) { throw 'La conexión HTTPS de origen no pasó.' }
          python installer/check_https.py --exe native/AKIRA/AKIRA.exe --report diagnostics/HTTPS_FROZEN_REV10.json
          if ($LASTEXITCODE -ne 0) { throw 'El ejecutable no valida correctamente los certificados HTTPS.' }
          $perf = Start-Process -FilePath './native/AKIRA/AKIRA.exe' -ArgumentList @('--low-resource-check', 'diagnostics/LOW_RESOURCE_FROZEN_REV10.json') -Wait -PassThru
          if ($perf.ExitCode -ne 0) { throw 'El perfil de ahorro o el ciclo financiero no pasaron la prueba de dos núcleos.' }

      - name: Leer biblioteca y derivados públicos reales desde el ejecutable
        shell: pwsh
        run: |
          $sources = Start-Process -FilePath './native/AKIRA/AKIRA.exe' -ArgumentList @('--sources-check', 'diagnostics/PUBLIC_SOURCES_FROZEN_REV10.json') -Wait -PassThru
          if ($sources.ExitCode -ne 0) { throw 'El ejecutable no completó las lecturas públicas de biblioteca y derivados BTC.' }

      - name: Incorporar llama.cpp oficial para Windows (CPU y Vulkan)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'https://github.com/ggml-org/llama.cpp/releases/download/b10355/'
          $items = @(
            @{ Name = 'llama-b10355-bin-win-vulkan-x64.zip'; Hash = '8ce9d58912f60974e2bd796e8a28826abb0801121454d451373ab98d8dd00f77'; Dest = 'bin' },
            @{ Name = 'llama-b10355-bin-win-cpu-x64.zip'; Hash = '5488e6232c6114d81302adc616d6c7470a8c06e24140e1baf1d0a85e3b731adc'; Dest = 'cpu' }
          )
          foreach ($item in $items) {
            $archive = Join-Path $env:RUNNER_TEMP $item.Name
            curl.exe -fL --retry 4 --retry-all-errors -o $archive ($release + $item.Name)
            if ($LASTEXITCODE -ne 0) { throw 'Error descargando el motor local oficial' }
            $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $item.Hash) { throw 'SHA256 incorrecto para ' + $item.Name }
            $extract = Join-Path $env:RUNNER_TEMP ('akira_llama_' + $item.Dest)
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $binary = Get-ChildItem $extract -Recurse -Filter 'llama-server.exe' | Select-Object -First 1
            if ($null -eq $binary) { throw 'Falta llama-server.exe en ' + $item.Name }
            $target = Join-Path 'native/AKIRA/local_ai' $item.Dest
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path (Join-Path $binary.DirectoryName '*') -Destination $target -Recurse -Force
          }
          if (!(Test-Path 'native/AKIRA/local_ai/bin/llama-server.exe')) { throw 'Vulkan no empaquetado' }
          if (!(Test-Path 'native/AKIRA/local_ai/cpu/llama-server.exe')) { throw 'CPU no empaquetado' }

      - name: Incorporar componente JavaScript de YouTube verificado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'deno-windows.zip'
          curl.exe -fL --retry 4 --retry-all-errors -o $archive 'https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar Deno oficial' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238') { throw 'Deno: SHA-256 incorrecto' }
          New-Item -ItemType Directory -Force -Path native/AKIRA/bin | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath native/AKIRA/bin -Force
          New-Item -ItemType Directory -Force -Path native/AKIRA/licenses | Out-Null
          Copy-Item third_party/DENO_LICENSE.txt native/AKIRA/licenses/DENO_LICENSE.txt
          if (!(Test-Path 'native/AKIRA/bin/deno.exe')) { throw 'Falta Deno en el paquete' }

      - name: Comprobar IA real en Windows sin Ollama
        shell: pwsh
        run: |
          python -m installer.smoke_local_ai --exe native/AKIRA/local_ai/cpu/llama-server.exe --model "$env:RUNNER_TEMP\Qwen3-4B-Q4_K_M.gguf" --report diagnostics/LOCAL_AI_SCENARIOS.json
          if ($LASTEXITCODE -ne 0) { throw 'La IA real no pasó los escenarios. Revisa LOCAL_AI_SCENARIOS.json y LOCAL_AI_SCENARIOS.llama.log.' }

      - name: Probar IA real de BTC y oro, general e individual, con contexto pequeño
        shell: pwsh
        run: |
          python qa_review_rev10.py --exe native/AKIRA/local_ai/cpu/llama-server.exe --model "$env:RUNNER_TEMP\Qwen3-4B-Q4_K_M.gguf" --report diagnostics/REAL_REVIEW_REV10.json
          if ($LASTEXITCODE -ne 0) { throw 'La revisión de ambos activos en ahorro no pasó con el modelo real.' }

      - name: Probar conversación con faltas, seguimiento y cambio de tema
        shell: pwsh
        run: |
          python qa_real_conversation_rev6.py --exe native/AKIRA/local_ai/cpu/llama-server.exe --model "$env:RUNNER_TEMP\Qwen3-4B-Q4_K_M.gguf" --report diagnostics/REAL_CONVERSATION_REV6_WINDOWS.json
          if ($LASTEXITCODE -ne 0) { throw 'La conversación real de Rev6 no pasó; no se publica el instalador.' }

      - name: Conversación real con interfaz y motor BTC-oro simultáneos en dos núcleos
        shell: pwsh
        timeout-minutes: 15
        run: |
          python qa_conversation_rev11.py --exe native/AKIRA/local_ai/cpu/llama-server.exe --model "$env:RUNNER_TEMP\Qwen3-4B-Q4_K_M.gguf" --report diagnostics/REAL_CHAT_LOW_RESOURCE_REV11.json
          if ($LASTEXITCODE -ne 0) { throw 'La conversación o el rendimiento durante inferencia real no pasaron; revisar REAL_CHAT_LOW_RESOURCE_REV11.json.' }

      - name: Empaquetar ejecutable con motor local (sin el modelo GGUF)
        shell: pwsh
        run: |
          $exe = 'native/AKIRA/AKIRA.exe'
          if (!(Test-Path $exe)) { throw 'No se produjo AKIRA.exe' }
          if ((Get-Item $exe).Length -lt 100000) { throw 'AKIRA.exe parece incompleto' }
          Compress-Archive -Path native/AKIRA/* -DestinationPath AKIRA_windows_build.zip -Force

      - name: Compilar instalador Windows con logo, Instalar y Cancelar
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo instalar el compilador Inno Setup' }
          $env:AKIRA_MODEL_PATH = Join-Path $env:RUNNER_TEMP 'Qwen3-4B-Q4_K_M.gguf'
          if (!(Test-Path $env:AKIRA_MODEL_PATH)) { throw 'Falta el modelo que pasó la prueba de IA' }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { & $iscc.Source 'installer/akira.iss' }
          else { & (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe') 'installer/akira.iss' }
          if ($LASTEXITCODE -ne 0) { throw 'No se compiló el instalador de AKIRA' }
          $setup = Get-ChildItem 'dist_installer' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $setup -or $setup.Length -lt 2000000000) { throw 'El instalador no incluye el modelo completo' }

      - name: Probar instalador completo y respuesta de la IA instalada
        shell: pwsh
        timeout-minutes: 20
        run: |
          $setup = Get-ChildItem 'dist_installer' -Filter '*_IA_INCLUIDA.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'No se encontró el instalador con la IA incluida' }
          $target = Join-Path $env:RUNNER_TEMP 'AKIRA_INSTALACION_VERIFICADA'
          python -m installer.check_installed_ai --setup "$($setup.FullName)" --root "$target" --report diagnostics/INSTALLED_LOCAL_AI.json
          if ($LASTEXITCODE -ne 0) { throw 'La instalación real o la IA instalada no pasaron la prueba; no se publica' }

      - name: Publicar instalador de AKIRA con IA incluida y verificada
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-16.4.6-Studio-Rev11-runners-chat-rendimiento-instalador-Windows-IA-INCLUIDA
          compression-level: 0
          path: dist_installer/*.exe
          retention-days: 7

      - name: Descargar binario construido
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-build-no-es-instalador
          path: AKIRA_windows_build.zip
          retention-days: 7

      - name: Descargar diagnosticos incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-Windows-diagnosticos
          path: |
            diagnostics/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
